apply plugin: 'java'
apply plugin: 'maven-publish'
apply plugin: 'idea'
apply plugin: 'eclipse'

group = 'org.jpos.template'
version = '2.1.8-SNAPSHOT'
sourceCompatibility = 11
targetCompatibility = 11

repositories {
    mavenCentral()
    maven { url 'https://jpos.org/maven' }
    mavenLocal()
}

dependencies {
    implementation 'org.jpos:jpos:2.1.10-SNAPSHOT'
    implementation 'org.jpos.ee:jposee-server-simulator:2.2.10-SNAPSHOT'
    implementation group:'junit', name:'junit', version:'4.8.2'
}

apply from: 'jpos-app.gradle'

